; Board build. Host unit tests use CMake instead (see README).
[platformio]
default_envs = esp32s3

; Lap display (Waveshare ESP32-S3-Touch-LCD-4.3)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3

; Flag panel (any ESP32-S3 + 16×16 WS2812B matrix)
[env:flagpanel]
extends = env:esp32s3
build_src_filter = +<flagpanel_main.cpp>

; Button box (ESP32-S3 DevKitC-1): USB gamepad + telemetry over one cable.
; USB_MODE=0 selects TinyUSB so HID and CDC run side by side.
[env:buttonbox]
extends = env:esp32s3
build_src_filter = +<buttonbox_main.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
; Display driver is chosen during the prototype (LovyanGFX or LVGL), e.g.:
;   lovyan03/LovyanGFX
