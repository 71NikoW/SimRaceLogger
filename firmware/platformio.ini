; Board build. Host unit tests use CMake instead (see README).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
; Display driver is chosen during the prototype (LovyanGFX or LVGL), e.g.:
;   lovyan03/LovyanGFX
